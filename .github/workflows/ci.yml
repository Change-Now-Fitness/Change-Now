name: CI/CD Pipeline

on: 
  pull_request: 
    branches: [ main, ci-pipeline ]
    types: [ opened, synchronize ]
    paths-ignore:
      - "docs/**"
      - "README.md"
  push:
    branches: [ main, ci-pipeline ]
    paths-ignore:
      - "docs/**"
      - "README.md"
      
permissions: 
  contents: read
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm run ci:all
      - name: Run linter
        run: npm run lint

  test:
    if: false #enable on production
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: http://localhost:4000
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: npm run ci:all

      #Test if we have all dependencies in server.js smoke test
      - name: Backend smoke import
        run: node -e "require('./backend/server.js'); console.log('backend imports ok')"
        
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run unit tests (Jest)
        run: npm test --prefix frontend

      - name: Start backend
        run: npm start --prefix backend &
      

      - name: Wait for backend
        run: npx wait-on --timeout 60000 http://localhost:4000/
        
      - name: Run end-to-end tests (Playwright)
        working-directory: frontend
        run: npm run test:e2e 

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results

  build_and_push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint] #add test back on prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::312695118456:role/change-now-github-actions-deploy-prod
          aws-region: us-east-2

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        env:
          ECR_REGISTRY: 312695118456.dkr.ecr.us-east-2.amazonaws.com
          ECR_REPOSITORY: change-now-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -f backend/Dockerfile backend
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  
  deploy_backend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build_and_push]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::312695118456:role/change-now-github-actions-deploy-prod
          aws-region: us-east-2

      - name: Deploy via SSM (pull new image + restart container)
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${INSTANCE_ID:-}" ]; then
            echo "Missing GitHub secret EC2_INSTANCE_ID"
            exit 1
          fi

          PARAMS=$(jq -n --arg cmd "bash /opt/change-now/deploy-backend.sh ${IMAGE_TAG}" '{commands: [$cmd]}')

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy change-now-backend:${IMAGE_TAG}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)"

          echo "SSM CommandId: $COMMAND_ID"

          # Wait up to ~10 minutes for the command to finish
          for attempt in $(seq 1 120); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)"

            if [ "$STATUS" = "Success" ]; then
              echo "Deploy succeeded."
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deploy failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for SSM command to finish."
          exit 1

