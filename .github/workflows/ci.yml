name: CI/CD Pipeline

#on push or pr, this will run lint and basic tests and show results in github actions
on: 
  pull_request: 
    branches: [ ci-pipeline ]
    types: [ opened, synchronize ]
  push:
    branches: [ ci-pipeline ]

permissions: 
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm run ci:all
      - name: Run linter
        run: npm run lint

  test:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm run ci:all
      - name: Run tests
        run: npm test

